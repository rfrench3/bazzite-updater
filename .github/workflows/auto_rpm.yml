on:
  push:
    tags:
      - '*'
  workflow_dispatch:
name: Build RPM
jobs:
  rpm:
    name: "RPM"
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        dnf install -y rpm-build
        dnf builddep -y bazzite_updater.spec
    - name: Build RPM
      env:
        HOME: /root
      run: |
        VERSION=$(cat version.txt)
        # Repack the checked-out source into a tarball with the prefix rpmbuild expects
        mkdir -p ~/rpmbuild/SOURCES
        tar --transform "s|^\.|bazzite_updater-$VERSION|" -czf ~/rpmbuild/SOURCES/$VERSION.tar.gz .
        rpmbuild -bb bazzite_updater.spec
    - name: Upload RPM artifact
      uses: actions/upload-artifact@v4
      with:
        name: bazzite_updater-rpm
        path: /root/rpmbuild/RPMS/**/*.rpm
    - name: Attach RPM to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: /root/rpmbuild/RPMS/**/*.rpm
