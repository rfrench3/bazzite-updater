on:
  push:
    branches: [main, GH-Workflow-RPM]
  pull_request:
name: CI
jobs:
  rpm:
    name: "RPM"
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full git history
    - name: Install dependencies
      run: |
        dnf install -y rpm-build git
        dnf builddep -y bazzite_updater.spec
    - name: Configure git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Build RPM
      run: |
        VERSION=$(cat version.txt)
        git archive --format=tar.gz --prefix=bazzite_updater-$VERSION/ -o /tmp/$VERSION.tar.gz HEAD
        mkdir -p ~/rpmbuild/SOURCES
        cp /tmp/$VERSION.tar.gz ~/rpmbuild/SOURCES/$VERSION.tar.gz
        rpmbuild -bb bazzite_updater.spec
      env:
        HOME: /root
    - name: Upload RPM
      uses: actions/upload-artifact@v4
      with:
        name: bazzite_updater-rpm
        path: /root/rpmbuild/RPMS/**/*.rpm