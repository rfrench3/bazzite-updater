[General]
# Supported values: atom, rss2, rss1
rssFeedType=rss2
rssFeed=https://universal-blue.discourse.group/tag/bazzite-news/11

# leave a command empty to disable it. Anything but system update will also become hidden.
# Use the following to run a systemd service: ./service-as-program.sh your-system.service
[Commands]
# When true, allow commands to be stopped mid-run by closing the app. Set to false if your configured commands do not gracefully handle being killed unexpectedly.
allowEarlyExit=true
systemUpdateCommand=./service-as-program.sh uupd-manual.service
systemRollbackCommand=bazzite-rollback-helper rollback -y

[Rebase]
enabled=true

# modify the KAboutData object for the OS in ./KAboutData_OS.json
